[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega01-quant"
version = "0.1.0"
description = "Mini hedge fund research lab for systematic trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
research = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "statsmodels>=0.14",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]

[project.scripts]
omega01-mt5-forex-inventory = "omega01.cli.mt5_forex_inventory:main"
omega01-mt5-fetch-forex = "omega01.cli.mt5_fetch_forex:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
